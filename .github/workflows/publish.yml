name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Release gate: a tag with no CHANGELOG entry fails HERE, before the
      # package reaches the registry. It is the one documentation failure that
      # cannot be repaired later — once the tarball is out, whoever upgraded
      # into it has no way to learn what changed.
      - name: Changelog entry for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi
          if ! grep -qE "^## +\[?v?${VERSION}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}. Add one — say what a consumer must DO — then re-tag."
            exit 1
          fi
          # ORDER, not just presence. The check above asks only whether a
          # heading exists SOMEWHERE. fancy-flow's changelog had four sections
          # inserted ABOVE the [Unreleased] marker, so everything appended
          # since -- including 0.49.0 -- landed below them, and reading
          # top-down showed 0.48.1 as newest. That PASSED the presence check.
          #
          # A consumer deciding whether to upgrade reads top-down. Complete but
          # mis-ordered is a truthful-looking lie, and it is invisible to
          # whoever wrote it, because they are looking at their own entry
          # rather than at the file.
          FIRST=$(grep -E '^## ' CHANGELOG.md                   | grep -viE '^## +\[?unreleased\]?'                   | head -1)

          if ! printf '%s' "$FIRST" | grep -qE "^## +\[?v?${VERSION}\]?"; then
            echo "::error::CHANGELOG.md has an entry for ${VERSION}, but it is NOT the first version heading."
            echo "::error::Top of file is: ${FIRST}"
            echo "::error::Move this release above the older entries, then re-tag."
            exit 1
          fi

          echo "Found changelog entry for ${VERSION}, and it is the newest."

      - name: package.json matches the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${VERSION}, package.json ${PKG_VERSION} — both must agree."
            exit 1
          fi

      # Bootstrap gate. Checked HERE, beside the changelog gate and before
      # anything is installed or built, for the same reason: a failure that
      # arrives after five minutes of green steps gets read as a flake.
      #
      # OIDC cannot CREATE a package name. Trusted Publishing is configured on a
      # package's own settings page, so there is nothing to configure until the
      # name is taken, and npm has no PyPI-style pending publisher. The first
      # publish of a new name always comes from an authenticated human.
      #
      # Without this the run fails at the very last step with
      # `E404 ... PUT ... Not found`, which reads as "the package does not
      # exist" -- true, irrelevant, and the reason this has been misdiagnosed
      # repeatedly. Confirmed again on fancy-trading-ui, 2026-08-22: every gate
      # passed and only Publish failed.
      - name: The package name exists on the registry
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME" version > /dev/null 2>&1; then
            echo "$NAME is on the registry — Trusted Publishing takes it from here."
            exit 0
          fi
          echo "::error::$NAME does not exist on npm, and THIS WORKFLOW CANNOT CREATE IT."
          echo "::error::OIDC publishes to an existing name; it cannot claim a new one, and npm has no pending-publisher equivalent."
          echo "::error::The account owner must bootstrap it once, from a laptop, in one sitting (npm login is a 2-hour session):"
          echo "::error::  npm login --auth-type=web && npm whoami"
          echo "::error::  npm version 0.0.0 --no-git-tag-version && npm publish --tag bootstrap --access public && npm version <real> --no-git-tag-version"
          echo "::error::Then add the Trusted Publisher at https://www.npmjs.com/package/$NAME/access (GitHub Actions / Particle-Academy / <repo> / publish.yml / no environment), delete this tag and re-push it."
          echo "::error::Full protocol: .ai/knowledge/publishing.md, 'Bootstrapping a brand-new package'."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Release gate: third-party dependencies must be approved and still
      # maintained BEFORE the tarball reaches the registry.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      # Trusted Publishing (OIDC) — no token. npm pinned to 11.18.0: npm 12.0.0
      # breaks --provenance ("Cannot find module 'sigstore'").
      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public
